# Every action, target form, zoom, cut, expect kind and camera move the schema has, in one valid
# storyboard. Beats 2 and 3 zoom, holding both camera tracks over [2s, 12s), so the camera moves
# sit in beat 1's [0s, 2s).
clip: every-form
ship: out/every-form.gif
frame:
  cols: 80
  rows: 24
  padding: 16
  font_size: 14
  line_height: 1.2
  scale: 2
  width: 600
  fps: 24
  max_colors: 128
expect:
  - seen: 'Goodbye'
  - run: test -f "$PHOTON_WORK/saved.txt"
beats:
  - id: 1
    title: open
    why: the first paint shows the list
    notes: no hold, so the section plays at its own speed throughout
    duration: 2s
    do:
      - wait: {screen: 'Items', timeout: 5s}
    expect:
      - seen: 'Items'
  - id: 2
    title: pick an item
    duration: 4s
    hold: 1s
    zoom:
      target: {text: 'Item \d', nth: last, area: list}
      factor: 1.5
    do:
      - click: {target: {text: 'Item 2', nth: first, area: list}, times: 2}
      - click: {target: {text: 'Item', nth: 3, area: any}}
      - click: {target: {text: 'Save'}}
      - drag: {from: {text: 'Item 1', area: list}, to: {text: 'Item 3', nth: last, area: list}, steps: 4}
      - drag: {from: {text: 'Item 2'}, to: {offset: {x: -3, y: 1}}}
    expect:
      - seen: 'Item 2 selected'
        area: status
      - run: grep -q 'Item 2' "$PHOTON_WORK/saved.txt"
  - id: 3
    title: type a note
    duration: 6s
    zoom:
      target: {text: 'Note:'}
      in: 500ms
      out: 250ms
    do:
      - type: {text: 'hello there'}
      - type: {text: 'fast', humanize: false}
      - key: {name: enter}
      - key: {name: down, repeat: 3}
      - wait: {screen: 'Saving', gone: true, timeout: 3m}
      - pause: {for: 800ms}
    expect:
      - seen: 'Saved'
        area: any
  - id: 4
    title: quit
    cut: true
    do:
      - key: {name: ctrl+c}
camera:
  - zoom: {to: 1.5, at: 200ms, over: 600ms, ease: linear}
  - zoom: {to: 1, at: {beat: 1, offset: 1s}, over: 500ms}
  - pan: {to: {cell: {x: 40, y: 12}}, at: {beat: 1, offset: 100ms}, over: 500ms}
  - pan: {to: {text: 'Item 1', nth: last, area: list}, at: 600ms, over: 400ms, ease: smooth}
  - pan:
      via:
        - {text: 'Items', nth: first, area: any}
        - {cell: {x: 10, y: 5}}
      at: 1s
      over: 800ms
