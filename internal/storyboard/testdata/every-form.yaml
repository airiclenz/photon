# Every action, target form, cut, expect kind, camera position and zoom and caption form the
# schema has, in one valid storyboard. The positions and zooms sit in beats 1 and 2, listed out of
# start order; the last zoom takes [1.8s, 2s). Captions sit in output space, so they may sit
# anywhere.
clip: every-form
ship: out/every-form.gif
frame:
  cols: 80
  rows: 24
  padding: 16
  font_size: 14
  line_height: 1.2
  scale: 2
  width: 600
  fps: 24
  max_colors: 128
expect:
  - seen: 'Goodbye'
  - run: test -f "$PHOTON_WORK/saved.txt"
beats:
  - id: 1
    title: open
    why: the first paint shows the list
    notes: no hold, so the section plays at its own speed throughout
    duration: 2s
    do:
      - wait: {screen: 'Items', timeout: 5s}
    expect:
      - seen: 'Items'
  - id: 2
    title: pick an item
    duration: 4s
    hold: 1s
    do:
      - click: {target: {text: 'Item 2', nth: first, area: list}, times: 2}
      - click: {target: {text: 'Item', nth: 3, area: any}}
      - click: {target: {text: 'Save'}}
      - drag: {from: {text: 'Item 1', area: list}, to: {text: 'Item 3', nth: last, area: list}, steps: 4}
      - drag: {from: {text: 'Item 2'}, to: {offset: {x: -3, y: 1}}}
    expect:
      - seen: 'Item 2 selected'
        area: status
      - run: grep -q 'Item 2' "$PHOTON_WORK/saved.txt"
  - id: 3
    title: type a note
    duration: 6s
    do:
      - type: {text: 'hello there'}
      - type: {text: 'fast', humanize: false}
      - key: {name: enter}
      - key: {name: down, repeat: 3}
      - wait: {screen: 'Saving', gone: true, timeout: 3m}
      - pause: {for: 800ms}
    expect:
      - seen: 'Saved'
        area: any
  - id: 4
    title: quit
    cut: true
    do:
      - key: {name: ctrl+c}
camera:
  positions:
    - {cell: {x: 40, y: 12}, at: {beat: 1, offset: 100ms}, hold: 400ms}
    - {cell: {x: 10, y: 5}, at: {beat: 2}, hold: 1s, ease: linear}
    - {text: 'Item 1', nth: last, area: list, at: 600ms, hold: 300ms, ease: ease-out}
    - text: 'Items'
      nth: first
      area: any
      at: 1s
      ease: ease-in
  zooms:
    - {to: 1.5, at: 200ms, over: 600ms, ease: linear}
    - {to: 1, at: {beat: 1, offset: 1s}, over: 500ms}
    - {to: 2, at: 1800ms, over: 200ms, ease: smooth}
captions:
  - text: "Pick an item\nthen save it"
    at: {beat: 2, offset: 200ms}
    until: {beat: 3}
    font: {size: 18, weight: bold}
    place: top
    align: left
    offset: {x: 8, y: -4}
    color: '#FFCC00'
    box: {color: '#202020', opacity: 0}
    fade: {in: 300ms, out: 200ms}
  - text: |
      Saved
    at: 9s
    for: 2s
    position: {x: 40, y: 300}
  - {text: 'Goodbye', at: {beat: 3, offset: -1s}, for: 1s}
