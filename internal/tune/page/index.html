<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>photon tune</title>
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/app.js" defer></script>
<script src="/assets/fit.js" defer></script>
<script src="/assets/frames.js" defer></script>
<script src="/assets/transport.js" defer></script>
<script src="/assets/controls.js" defer></script>
<script src="/assets/panels.js" defer></script>
<script src="/assets/entries.js" defer></script>
<script src="/assets/lanes.js" defer></script>
<script src="/assets/drag.js" defer></script>
<script src="/assets/timeline.js" defer></script>
<script src="/assets/picker.js" defer></script>
</head>
<body>
<div id="banner" class="banner" hidden>
  <span id="banner-text"></span>
  <button id="reload" type="button" hidden>Reload</button>
</div>
<main class="workspace">
  <section id="preview" class="preview" aria-label="Preview">
    <div id="stage" class="stage">
      <img id="frame" alt="The composed frame at the playhead" draggable="false">
      <div id="pick-drag" class="pick-drag" hidden></div>
      <div id="pick-box" class="pick-box" hidden></div>
    </div>
    <p id="frame-message" class="frame-message" hidden></p>
    <div class="picker">
      <button id="pick" type="button" aria-pressed="false" title="Pick a target: drag across the cells of one row">&#x2316; Pick</button>
      <span id="pick-status" class="status" role="status"></span>
    </div>
    <div id="pick-result" class="pick-result" hidden>
      <code id="pick-target" class="pick-target"></code>
      <div class="pick-actions">
        <button type="button" data-snippet="click">Copy click</button>
        <button type="button" data-snippet="seen">Copy seen</button>
        <button type="button" data-snippet="drag-from">Copy drag from</button>
        <button type="button" data-snippet="drag-to">Copy drag to</button>
      </div>
    </div>
  </section>
  <aside class="inspector" aria-label="Inspector">
    <label class="inspector-pick">
      <span>Inspect</span>
      <select id="beat-select"></select>
    </label>
    <div id="inspector-body"></div>
  </aside>
  <nav id="transport" class="transport" aria-label="Transport">
    <button id="previous" type="button" title="Previous section start">&#x23EE;</button>
    <button id="play" type="button" title="Play or pause (Space)">&#x25B6;</button>
    <button id="next" type="button" title="Next section start">&#x23ED;</button>
    <output id="time" class="time">0:00.000</output>
    <span class="transport-gap"></span>
    <span id="status" class="status" role="status"></span>
    <button id="undo" type="button">Undo</button>
    <button id="redo" type="button">Redo</button>
    <button id="revert" type="button" title="Drop every unsaved edit">Revert</button>
    <button id="save" type="button" class="primary">Save</button>
    <span id="build" class="build"></span>
  </nav>
  <section id="timeline-panel" class="timeline" aria-label="Timeline">
    <div id="timeline" class="timeline-rows"></div>
  </section>
</main>
</body>
</html>
