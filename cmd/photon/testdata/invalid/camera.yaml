# A storyboard whose camera breaks five rules: a position that starts after the 4s clip ends, a
# position held for less than nothing, a zoom with no length, a zoom past 3×, and two zooms that
# overlap.
clip: camera
ship: out/camera.gif
frame: {cols: 80, rows: 24, padding: 16, font_size: 14, line_height: 1.2, scale: 2, width: 600, fps: 24, max_colors: 128}
beats:
  - id: 1
    title: tour the list
    duration: 4s
camera:
  positions:
    - {cell: {x: 4, y: 2}, at: 9s}
    - {text: 'Item', at: 1s, hold: -1s}
  zooms:
    - {to: 2, at: 0s, over: 0s}
    - {to: 3.5, at: 500ms, over: 500ms}
    - {to: 2, at: 2s, over: 1s}
    - {to: 1, at: 2500ms, over: 1s}
