# golangci-lint configuration. The tool is pinned by module version in the Makefile
# (GOLANGCI_LINT_VERSION); `make lint` and CI both run with this file.
version: "2"

linters:
  # The standard set: the checks golangci-lint ships as its default.
  default: standard
  settings:
    staticcheck:
      # Setting `checks` replaces golangci-lint's own default list, so the style checks it
      # disables by default are restated here. `-QF*` drops the quickfix group: those are
      # refactoring suggestions, not defects.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF*

formatters:
  # gofmt is the one formatter (Note coding-conventions); `run` reports any file it would change.
  enable:
    - gofmt

issues:
  # golangci-lint caps its output by default (50 per linter, 3 per message). Report every finding.
  max-issues-per-linter: 0
  max-same-issues: 0
